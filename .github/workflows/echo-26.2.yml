name: Echo 26.2 build

on:
  push:
    branches: [main]
    paths:
      - 'Echo/**'
      - '.github/workflows/echo-26.2.yml'
  pull_request:
    paths:
      - 'Echo/**'
      - '.github/workflows/echo-26.2.yml'
  workflow_dispatch:

# Simultaneous runs fight over the same cache keys and saturate the network.
concurrency:
  group: echo-26.2-${{ github.ref }}
  cancel-in-progress: true

  # Releasing the built jar needs write access to the repository contents.
permissions:
  contents: write

defaults:
  run:
    working-directory: Echo/echo-clean-source-035

jobs:
  # The client's renderer loads two Rust cdylibs out of /native/<platform>/.
  # `fastJar` cannot produce them, and without them UiRenderer throws during the
  # resource reload: no ClickGUI, no HUD, and Minecraft drops every resource pack.
  # They are built here once and handed to the packaging job.
  natives:
    name: Native libraries (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Echo/echo-clean-source-035/native/renderer/target
            Echo/echo-clean-source-035/native/media/target
            Echo/echo-clean-source-035/native/lwjgl-compat/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Echo/echo-clean-source-035/native/*/Cargo.lock') }}

      # A gnu build links its CRT statically, which is safer to hand to System.load
      # than depending on the VC redistributable. If the target's std/linker is not
      # available, fall back to the host toolchain: the artifact is still a PE DLL.
      - name: Build naga_jni, media_session
        working-directory: Echo/echo-clean-source-035
        shell: pwsh
        run: |
          $triple = 'x86_64-pc-windows-gnu'
          $ok = $true
          rustup target add $triple
          if ($LASTEXITCODE -ne 0) { $ok = $false }
          if ($ok) {
            cargo build --release --manifest-path native/renderer/Cargo.toml --target $triple
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          }
          if ($ok) {
            cargo build --release --manifest-path native/media/Cargo.toml --target $triple
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          }
          if ($ok) {
            cargo build --release --manifest-path native/lwjgl-compat/Cargo.toml --target $triple
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          }
          if (-not $ok) {
            Write-Host "::warning::$triple unavailable; falling back to the host target"
            $triple = 'release'
            cargo build --release --manifest-path native/renderer/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cargo build --release --manifest-path native/media/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cargo build --release --manifest-path native/lwjgl-compat/Cargo.toml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            "TARGET_TRIPLE=$triple" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "TARGET_TRIPLE=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          rustup target list --installed

      - name: Collect natives
        working-directory: Echo/echo-clean-source-035
        run: |
          $out = "staged-natives/native/windows-x86_64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dir = if ($env:TARGET_TRIPLE -eq 'release') { 'release' } else { "$env:TARGET_TRIPLE/release" }
          Copy-Item "native/renderer/target/$dir/naga_jni.dll"   $out
          Copy-Item "native/media/target/$dir/media_session.dll"        $out
          Copy-Item "native/lwjgl-compat/target/$dir/echo_stb_legacy.dll" $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload natives
        uses: actions/upload-artifact@v4
        with:
          name: echo-natives-windows-x86_64
          path: Echo/echo-clean-source-035/staged-natives/
          if-no-files-found: error

  build:
    name: Compile & package (JDK 25)
    needs: natives
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Minecraft 26.x requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Caches ~/.gradle: artifacts, the Gradle distribution and
      # caches/fabric-loom (processed Minecraft). A warm hit removes the
      # multi-minute Loom setup that dominated the cold runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # A green compile proves nothing about mixin selectors: they are strings
      # in annotations, invisible to javac, and a stale one crashes the client at
      # class-load time. This gate fails the build instead, in under a second.
      - name: Verify mixin targets against 26.2
        run: |
          python3 tools/port/verify_mixins.py tools/port/mc262-mixin-index.json.gz
          # a target that changed shape invalidates the handler, not the selector
          python3 tools/port/verify_handler_signatures.py tools/port/mc262-mixin-index.json.gz

      # Drop the built natives where the runtime looks for them. fastJar copies
      # src/main/resources verbatim, so this is all the staging the jar needs.
      - name: Stage native libraries
        uses: actions/download-artifact@v4
        with:
          name: echo-natives-windows-x86_64
          path: Echo/echo-clean-source-035/src/main/resources

      - name: Assert natives are packaged
        run: |
          set -eu
          for lib in naga_jni.dll media_session.dll echo_stb_legacy.dll; do
            test -f "src/main/resources/native/windows-x86_64/$lib" || {
              echo "::error::missing native $lib - the client would start without a renderer"
              exit 1
            }
            echo "staged $lib ($(stat -c%s "src/main/resources/native/windows-x86_64/$lib") bytes)"
          done

      # One Gradle invocation for the whole build: fastJar depends on
      # compileJava, so a second JVM startup would be pure overhead.
      #
      # compileJava is the real correctness gate; fastJar packages classes and
      # resources without the cargo/native staging or the source gates that the
      # fully-gated `jar`/`build` targets keep.
      #
      # Dependency verification is off because its metadata still describes the
      # 1.21.11 graph and would reject the 26.2 artifacts.
      - name: Compile & package
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::fastJar attempt $attempt"
            if ./gradlew --console=plain --dependency-verification=off fastJar 2>&1 | tee compile.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # Retry transient network failures only; a compiler error is final.
            if ! grep -qE 'Read timed out|Could not download|Connection reset|Could not GET|EOFException' compile.log; then
              echo "::error::build failed (not a network error) - not retrying"
              exit 1
            fi
            echo "network failure, retrying..."
            sleep 15
          done
          exit 1

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          find build/fastlibs -maxdepth 1 -name '*.jar' -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          ls -la /tmp/artifacts

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-26.2-jar
          path: /tmp/artifacts/
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-26.2-build-log
          path: Echo/echo-clean-source-035/compile.log
          if-no-files-found: warn

      # Every green build is also published as a GitHub Release, so the jar can
      # be downloaded without digging through workflow artifacts (those expire,
      # releases do not). The tag is per-run, so builds never collide.
      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Echo 26.2 build ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Automated 26.2 build of Echo client.

            | | |
            | --- | --- |
            | Commit | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | Branch | `${{ github.ref_name }}` |
            | Workflow run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | Jar | `echo-26.2-fast-*.jar` |

            Mixin selectors, `@Shadow` targets and reachable `@At` call sites were
            validated against Minecraft 26.2 before packaging. Hooks that 26.2
            moved are quarantined with `require = 0` — see `docs/PORT-26.2.md`.
          files: /tmp/artifacts/*.jar

      # Keep the release list short: the API returns newest first, so anything
      # past the first 15 automated builds is pruned (artifact + its tag).
      - name: Prune old release builds
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("build-")) | "\(.id) \(.tag_name)"' \
          | tail -n +16 | while read -r id tag; do
              echo "pruning $tag"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
            done
