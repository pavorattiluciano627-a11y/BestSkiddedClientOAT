name: Echo 26.2 build

on:
  push:
    branches: [main]
    paths:
      - 'Echo/**'
      - '.github/workflows/echo-26.2.yml'
  pull_request:
    paths:
      - 'Echo/**'
      - '.github/workflows/echo-26.2.yml'
  workflow_dispatch:

# Two simultaneous runs share the same cache keys and saturate the network,
# which is what made the first runs slow. Keep one run per ref.
concurrency:
  group: echo-26.2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Echo/echo-clean-source-035

jobs:
  build:
    name: Compile & package (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing in the build reads git history.
          fetch-depth: 1

      # Minecraft 26.x requires Java 25; verifyToolchain fails by design on older.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Caches ~/.gradle: resolved artifacts, the Gradle distribution, and
      # caches/fabric-loom (the processed Minecraft jar). A warm hit removes the
      # multi-minute Loom setup that dominated the cold runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Report toolchain
        run: java -version && ./gradlew --version

      # Dependency-verification metadata still describes the 1.21.11 graph, so the
      # first 26.2 resolution rejects the new artifacts. Disabled for this build.
      #
      # compileJava is the real correctness gate and has no native/gate deps.
      - name: Compile
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::compileJava attempt $attempt"
            if ./gradlew --console=plain --dependency-verification=off compileJava 2>&1 | tee compile.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # Only re-try transient network failures; a real compiler error will
            # never fix itself.
            if ! grep -qE 'Read timed out|Could not download|Connection reset|Could not GET|EOFException' compile.log; then
              echo "::error::compilation failed (not a network error) - not retrying"
              exit 1
            fi
            echo "network failure, retrying..."
            sleep 15
          done
          exit 1

      # Fast packaging: classes + resources, no cargo/native staging and no
      # source gates (those stay on the fully gated `jar`/`build` targets).
      - name: Package
        run: ./gradlew --console=plain --dependency-verification=off fastJar

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          find build/fastlibs -maxdepth 1 -name '*.jar' -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          cp build/reports/foundation/toolchain.json /tmp/artifacts/ 2>/dev/null || true
          ls -la /tmp/artifacts

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-26.2-jar
          path: /tmp/artifacts/
          if-no-files-found: warn

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-26.2-compile-log
          path: Echo/echo-clean-source-035/compile.log
          if-no-files-found: warn
