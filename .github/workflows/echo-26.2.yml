name: Echo 26.2 build

on:
  push:
    branches: [main]
    paths:
      - 'Echo/**'
      - '.github/workflows/echo-26.2.yml'
  pull_request:
    paths:
      - 'Echo/**'
      - '.github/workflows/echo-26.2.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Echo/echo-clean-source-035

jobs:
  build:
    name: Compile & package (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 26.x requires Java 25; the build's verifyToolchain task fails by
      # design on anything older.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper pins Gradle 9.8.2; let the action manage the daemon/cache.
          cache-read-only: false

      - name: Report toolchain
        run: java -version && ./gradlew --version

      # Dependency verification metadata still describes the 1.21.11 graph, so the
      # first 26.2 resolution would reject the new artifacts. Verification is
      # disabled for this build; regenerating the metadata is a separate task.
      - name: Compile
        run: |
          set -o pipefail
          # Loom pulls large artifacts (mercury, Minecraft, mappings) on a cold
          # cache; a transient read timeout should not fail the whole build.
          for attempt in 1 2 3; do
            echo "::group::compileJava attempt $attempt"
            if ./gradlew --no-daemon --console=plain --dependency-verification=off compileJava 2>&1 | tee /tmp/compile.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            sleep 20
          done
          exit 1
        env:
          GRADLE_OPTS: -Xmx3g

      - name: Test
        if: success()
        continue-on-error: true
        run: ./gradlew --no-daemon --console=plain --dependency-verification=off test

      - name: Build jar
        id: jar
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --dependency-verification=off build 2>&1 | tee /tmp/build.log
        env:
          GRADLE_OPTS: -Xmx3g

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          find build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          cp build/reports/foundation/toolchain.json /tmp/artifacts/ 2>/dev/null || true
          ls -la /tmp/artifacts

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-26.2-jar
          path: /tmp/artifacts/
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-26.2-build-log
          path: /tmp/build.log
          if-no-files-found: warn
