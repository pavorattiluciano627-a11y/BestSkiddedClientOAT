import java.security.MessageDigest
import java.util.zip.ZipFile

apply plugin: 'java-library'
group = 'echo.clean.thirdparty'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(providers.gradleProperty('java_release').getOrElse('25').toInteger()) }
    withSourcesJar()
}

configurations {
    upstreamBinary { canBeResolved = true; canBeConsumed = false; transitive = false }
    upstreamSources { canBeResolved = true; canBeConsumed = false; transitive = false }
    compileOnly.extendsFrom upstreamBinary
}
dependencies {
    upstreamBinary upstreamCoordinate
    upstreamSources "${upstreamCoordinate}:sources"
    compileOnly 'org.jetbrains:annotations:26.0.2'
}
dependencyLocking { lockAllConfigurations() }

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-proc:none')
    options.fork = true
    options.forkOptions.memoryMaximumSize = '384m'
    // Ordinary javac output is the product. ACC_SYNTHETIC restoration and
    // reference-compiler bytecode identity are intentionally not build stages.
}

// Resolved once at configuration time. Capturing `configurations` or `sourceSets`
// inside a doLast/from closure makes the task incompatible with Gradle's
// configuration cache, which the build enables for CI speed.
def upstreamBinaryFile = configurations.upstreamBinary.singleFile
def upstreamSourcesFile = configurations.upstreamSources.singleFile
def patchedSourceCount = sourceSets.main.java.files.size()
def ownClassesDirs = sourceSets.main.output.classesDirs.files

tasks.register('verifyUpstream') {
    group = 'verification'
    inputs.files(upstreamBinaryFile, upstreamSourcesFile)
    inputs.property('expectedBinarySha256', upstreamSha256)
    inputs.property('expectedSourcesSha256', upstreamSourceSha256)
    inputs.property('expectedPatchedSources', expectedPatchedSources)
    inputs.property('patchedSourceCount', patchedSourceCount)
    doLast {
        [[upstreamBinaryFile, upstreamSha256],
         [upstreamSourcesFile, upstreamSourceSha256]].each { pair ->
            def actual = MessageDigest.getInstance('SHA-256').digest(pair[0].bytes).encodeHex().toString()
            if (actual != pair[1]) { throw new GradleException("Unrecognized public upstream artifact: ${pair[0].name}") }
        }
        if (patchedSourceCount != expectedPatchedSources) {
            throw new GradleException("Expected ${expectedPatchedSources} readable patches for ${upstreamCoordinate}")
        }
    }
}

tasks.named('compileJava') { dependsOn 'verifyUpstream' }

// Published upstream code is permitted third-party input. Replace entire classes
// (including companions produced by javac) only inside these public libraries.
// This is dependency packaging; no first-party method/body grafting is performed.
tasks.named('jar', Jar) {
    dependsOn 'verifyUpstream'
    from(zipTree(upstreamBinaryFile)) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
        exclude { item -> ownClassesDirs.any { new File(it, item.path).isFile() } }
    }
    manifest.attributes('Implementation-Title': "${upstreamCoordinate} with readable local URL guards",
            'Implementation-Version': project.version,
            'Echo-Patch-Source': 'seven ordinary Java sources; no classfile rewriting')
}

// Make all upstream source editable in the published source archive, replacing
// only the three/four patched source entries with our retained readable copies.
tasks.named('sourcesJar', Jar) {
    dependsOn 'verifyUpstream'
    from(zipTree(upstreamSourcesFile)) {
        exclude 'META-INF/MANIFEST.MF'
        exclude { item -> new File(projectDir, 'src/main/java/' + item.path).isFile() }
    }
}

tasks.register('verifyPatchedLibrary', Exec) {
    group = 'verification'
    dependsOn 'jar', 'sourcesJar'
    commandLine 'python3', rootProject.file('tools/build/verify_library.py').absolutePath,
            '--project', projectDir.absolutePath, '--package', upstreamPackage,
            '--expected', expectedPatchedSources.toString(),
            '--jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
            '--sources-jar', tasks.named('sourcesJar').get().archiveFile.get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'verifyPatchedLibrary' }
