pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = uri('https://maven.fabricmc.net/') }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
    }
}

rootProject.name = 'echo-clean-source'
include 'third-party:jsvg', 'third-party:rhino'
