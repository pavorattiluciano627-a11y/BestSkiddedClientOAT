org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false
org.gradle.caching=false
# Loom resolves large artifacts (mercury, Minecraft jars) over the network; the
# defaults time out on slow or rate-limited runners.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1500

# Minecraft 26.2 ("Chaos Cubed") is unobfuscated: there is no `mappings` entry and
# no `yarn_mappings`, because Yarn was retired after 1.21.11.
#
# STATUS: the build wiring below is migrated to 26.2. The Java sources still use
# Yarn names and must be remapped to Mojang's official names before this project
# compiles; see docs/PORT-26.2.md for the one migration step and its ordering.
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_version=0.161.0+26.2
mod_version=1.4.0-26.2

# Must track the LWJGL shipped by Minecraft 26.2. Verify with
# `./gradlew resolveFoundationDependencies` after a fresh 26.2 metadata resolution.
lwjgl_version=3.4.3

# Java 25 is the minimum runtime for 26.x (up from 21).
java_release=25
